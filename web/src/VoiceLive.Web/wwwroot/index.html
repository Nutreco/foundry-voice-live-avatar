<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Live Avatar</title>
    <style>
      body {
        background: #f6f7fb;
        color: #121826;
        margin: 0;
        font-family: system-ui, sans-serif;
      }

      .operator-shell {
        display: grid;
        gap: 1rem;
        grid-template-columns: minmax(18rem, 28rem) minmax(20rem, 1fr);
        max-width: 72rem;
        padding: 2rem;
      }

      .operator-shell h1,
      .error-banner {
        grid-column: 1 / -1;
      }

      .avatar-panel,
      .config-panel,
      .status-panel,
      .controls,
      .tools-panel,
      .transcripts {
        background: #fff;
        border: 1px solid #d9dee8;
        border-radius: 0.75rem;
        box-shadow: 0 0.25rem 1rem rgb(18 24 38 / 8%);
        padding: 1rem;
      }

      .avatar-panel {
        padding: 0;
        overflow: hidden;
      }

      .operator-shell #avatar {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
      }

      .status-panel,
      .controls,
      .safe-questions,
      .transcripts {
        display: grid;
        gap: 0.5rem;
      }

      .status-line,
      .transcript-line,
      .config-panel p {
        margin: 0;
      }

      .transcripts {
        grid-column: 1 / -1;
        max-height: 18rem;
        overflow: auto;
      }

      .transcript-line.live {
        opacity: 0.72;
        font-style: italic;
      }

      button {
        border: 0;
        border-radius: 0.5rem;
        background: #2454d6;
        color: #fff;
        cursor: pointer;
        font: inherit;
        padding: 0.75rem 1rem;
      }

      button:disabled {
        background: #9aa4b5;
        cursor: not-allowed;
      }

      button.active {
        background: #b42318;
      }

      .reconnect-button {
        background: #2563eb;
        color: #fff;
        padding: 0.7rem 1rem;
        cursor: pointer;
      }

      .reconnect-button[hidden] {
        display: none;
      }

      .operator-shell .reconnect-button {
        grid-column: 1 / -1;
        justify-self: start;
      }

      .error-banner,
      .display-status.error {
        background: #fef3f2;
        border: 1px solid #fecdca;
        color: #b42318;
        padding: 0.75rem 1rem;
      }

      .nonfatal-notice {
        grid-column: 1 / -1;
        background: #fffaeb;
        border: 1px solid #fedf89;
        color: #b54708;
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
      }

      body.display-view {
        background: #000;
      }

      body.display-view #avatar {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }

      .display-status {
        position: fixed;
        left: 1rem;
        top: 1rem;
        max-width: min(32rem, calc(100vw - 2rem));
        border-radius: 0.5rem;
        background: rgb(0 0 0 / 70%);
        color: #fff;
        padding: 0.75rem 1rem;
      }

      .display-reconnect {
        display: block;
        margin-top: 0.75rem;
      }

      body.landing-view {
        background: #000;
      }

      .landing-avatar {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        background: #000;
      }

      .landing-pill {
        position: fixed;
        top: 4.5rem; /* always clear the toolbar (1rem top + ~2.25rem height + buffer) */
        left: 50%;
        transform: translateX(-50%);
        z-index: 3; /* above transcript panel (2) */
        background: rgb(0 0 0 / 60%);
        color: #fff;
        padding: 0.4rem 0.9rem;
        border-radius: 999px;
        font-size: 0.85rem;
      }

      .landing-actions {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 3;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      .landing-action {
        background: #fff;
        color: #121826;
        border: 1px solid #d9dee8;
        border-radius: 999px;
        box-shadow: 0 0.15rem 0.5rem rgb(0 0 0 / 30%);
        font: inherit;
        font-weight: 600;
        padding: 0.4rem 0.85rem;
        min-height: 2.25rem;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
      }

      .landing-action:hover {
        background: #f0f2f8;
      }

      .landing-action:focus-visible {
        outline: 2px solid #2454d6;
        outline-offset: 2px;
        background: #f0f2f8;
      }

      .landing-talk {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 999px;
        padding: 0.9rem 1.6rem;
        font-size: 1rem;
        box-shadow: 0 0.3rem 1rem rgb(0 0 0 / 40%);
      }

      .landing-talk.muted {
        background: #6b7280;
      }

      .landing-reconnect {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        z-index: 5; /* above transcript (2), toolbar (3), and error overlay (4) */
        transform: translateX(-50%);
        border-radius: 999px;
        box-shadow: 0 0.3rem 1rem rgb(0 0 0 / 40%);
      }

      .landing-transcript-toggle {
        /* Inherits .landing-action styles; no extra overrides needed */
      }

      .landing-transcript {
        position: fixed;
        top: 4.5rem; /* start below the toolbar (toolbar top 1rem + height ~2.25rem + buffer) */
        right: 0;
        bottom: 0;
        width: min(24rem, 80vw);
        z-index: 2;
        background: rgb(8 13 24 / 82%);
        backdrop-filter: blur(6px);
        border-left: 1px solid rgb(255 255 255 / 10%);
        transform: translateX(100%);
        transition: transform 0.2s ease;
        display: flex;
        flex-direction: column;
        color: #e8edf7;
      }

      .landing-transcript.open {
        transform: translateX(0);
      }

      .landing-transcript header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem;
        font-weight: 600;
      }

      .landing-transcript-close {
        background: none;
        color: #9aa4b5;
        font-size: 1.4rem;
        padding: 0;
      }

      .landing-transcript-list {
        display: grid;
        gap: 0.5rem;
        padding: 0 1rem 1rem;
        overflow: auto;
      }

      .landing-transcript-list .transcript-line.live {
        opacity: 0.72;
        font-style: italic;
      }

      .landing-notice {
        position: fixed;
        top: 4.5rem; /* always clear the toolbar (1rem top + ~2.25rem height + buffer) */
        left: 50%;
        transform: translateX(-50%);
        z-index: 3; /* above transcript panel (2); below error overlay (4) and reconnect (5) */
        max-width: min(32rem, 90vw);
        background: rgb(180 35 24 / 92%);
        color: #fff;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
      }

      .landing-error {
        position: fixed;
        inset: 0;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        background: rgb(0 0 0 / 75%);
        color: #fff;
      }

      .landing-error[hidden] {
        display: none;
      }

      @media (max-width: 760px) {
        .operator-shell {
          grid-template-columns: 1fr;
          padding: 1rem;
        }

        .transcripts {
          grid-column: auto;
        }

        .landing-transcript {
          top: auto;
          width: 100vw;
          height: 60vh;
          transform: translateY(100%);
        }

        .landing-transcript.open {
          transform: translateY(0);
        }

        .landing-actions {
          top: 0.6rem;
          right: 0.6rem;
          gap: 0.35rem;
        }

        .landing-action {
          padding: 0.3rem 0.65rem;
          min-height: 2rem;
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
